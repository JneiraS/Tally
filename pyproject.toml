[project]
name = "protab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Johnny Neira", email = "johnny.neira@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
protab = "protab:main"
protab-project = "protab.project_admin:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Starlette 1.6.0 accesses this deprecated anyio alias while importing TestClient.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]
